{% extends "layout.html" %}{% block body %}
<h2>Settings</h2>
<form method="post" class="card">
  <label>First alert after (seconds away) <input name="away1" type="number" min="1" value="{{ s.away1 }}"></label>
  <label>Second alert after (seconds away) <input name="away2" type="number" min="1" value="{{ s.away2 }}"></label>
  <label>Break reminder every (minutes) <input name="break_every" type="number" min="1" value="{{ s.break_every }}"></label>
  <label>Break length (minutes) <input name="break_len" type="number" min="1" value="{{ s.break_len }}"></label>
  <label class="check"><input name="check_eyes" type="checkbox" {{ "checked" if s.check_eyes }}>
    Require eyes to be detected (turn off if you wear glasses)</label>
  <button>Save</button>
</form>{% endblock %}
